# Verifies every pull request and every push to main. The Bun version comes from package.json:
# docs/coding-standards.md#dependencies. The steps mirror `verify:all` so a failure names its step.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token; the workflow needs no secrets, so none are referenced.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Pinned to full commit SHAs. Dependabot keeps them current (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run budget
