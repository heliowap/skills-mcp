# Weekly updates for Bun packages and GitHub Actions. Security updates are sent per vulnerable
# dependency and are enabled in the repository settings, not here.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    # Blocks version updates of @types/bun, which move only with the Bun upgrade
    # (docs/coding-standards.md#dependencies). Listing every version update type leaves security updates
    # open: a security PR fails test/pins.test.ts until the upgrade is done (ADR-0021).
    ignore:
      - dependency-name: "@types/bun"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  # Keeps the SHA pins in .github/workflows/ci.yml current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
