# Weekly Bun updates. Security updates are sent per vulnerable dependency and are
# enabled in the repository settings, not here.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    # Moves only with the Bun upgrade process: docs/coding-standards.md#dependencies.
    ignore:
      - dependency-name: "@types/bun"
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
