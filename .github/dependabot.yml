# Weekly updates for Bun packages and GitHub Actions. Security updates are sent per vulnerable
# dependency and are enabled in the repository settings, not here.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    # Moves only with the Bun upgrade process: docs/coding-standards.md#dependencies.
    ignore:
      - dependency-name: "@types/bun"
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  # Keeps the SHA pins in .github/workflows/ci.yml current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
